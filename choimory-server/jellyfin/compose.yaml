# Jellyfin: 영화·드라마 스트리밍 서버
# Cloudflare Tunnel로 노출하지 않는다. (대용량 영상 전송은 Cloudflare 약관 문제 소지) 외부 시청은 Tailscale로 한다.
#
# 접속: LAN(TV 등), Tailscale (http://<서버 IP>:8096)
#
# 하드웨어 트랜스코딩 (AMD Radeon 680M, VA-API)
#   - Jellyfin 관리 화면 > 재생 > 트랜스코딩에서 VA-API, 장치 /dev/dri/renderD128 지정
#   - 검증: docker exec -it jellyfin /usr/lib/jellyfin-ffmpeg/vainfo --display drm --device /dev/dri/renderD128
#
# 사전 준비
#   mkdir -p /data/apps/jellyfin/{config,cache}
name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    restart: unless-stopped

    # 공식 이미지는 PUID/PGID를 지원하지 않으므로 user로 실행 계정을 지정한다. (choimory:homeserver)
    user: "1000:1500"

    # /dev/dri/renderD128은 root:render 소유라 render 그룹을 추가해야 GPU에 접근할 수 있다.
    group_add:
      - "${RENDER_GID}"

    # VA-API 하드웨어 트랜스코딩용 GPU 장치
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

    # TV 등 Tailscale이 없는 LAN 기기도 접속해야 하므로 전체 인터페이스에 바인딩한다.
    ports:
      - "8096:8096"

    volumes:
      - /data/apps/jellyfin/config:/config
      - /data/apps/jellyfin/cache:/cache
      # 미디어 원본은 Jellyfin이 수정하지 않도록 읽기 전용으로 마운트한다. 메타데이터는 /config에 저장된다.
      - /data/nas/media:/media:ro

    environment:
      TZ: Asia/Seoul
