# Homepage 북마크
# 서버의 /data/apps/homepage/config/bookmarks.yaml로 복사해서 쓴다.

# 서버 운영 중 자주 여는 관리 페이지
# 그룹 이름을 services.yaml 그룹(관리 등)과 겹치게 지으면 북마크가 표시되지 않으므로 다른 이름을 쓴다.
- 바로가기:
    # 공유기 관리 화면은 집 LAN에서만 열린다. 밖에서는 SSH 터널(ssh -L 8081:192.168.10.1:80 choimory@choimory-server)로 연다.
    - 공유기 (ipTIME):
        - abbr: IP
          href: http://192.168.10.1
    - Tailscale 관리 콘솔:
        - abbr: TS
          href: https://login.tailscale.com/admin/machines
    - GitHub 저장소:
        - abbr: GH
          href: https://github.com/choimory/choimory-docker-compose/tree/dev
