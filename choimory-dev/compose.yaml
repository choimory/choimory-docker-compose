# choimory-dev: 개인 프로젝트 choimory-dev의 로컬 구동용 (맥북, Docker Desktop)
#
# 실행 모드 (profiles)
#   모든 서비스에 profile을 달고, .env의 COMPOSE_PROFILES=all을 기본값으로 둔다.
#   profile이 없는 서비스는 어떤 profile을 줘도 항상 뜨기 때문에, db-only처럼 일부만 띄우려면 모든 서비스에 profile이 필요하다.
#   명령에 --profile을 주면 .env의 COMPOSE_PROFILES보다 우선한다.
#
#   전체:                         docker compose up -d
#   백엔드를 IDE로 개발:           docker compose --profile db-only up -d        → postgres, redis
#   프론트를 IDE로 개발/확인:      docker compose --profile back-only up -d      → postgres, redis, member-api
#   백엔드 전부 IDE + 프론트:      docker compose --profile db-only --profile front-only up -d
#   특정 서비스만 빼기:            docker compose up -d --scale member-api=0     (IDE로 돌리는 서비스를 0으로)
#   종료(모든 경우):               docker compose down                            (기본 profile all이라 전부 정리)
#
#   앱 코드가 바뀌었으면 up에 --build, 앱 이미지까지 지우려면 down에 --rmi local을 붙인다.
#   .env에서 COMPOSE_PROFILES를 지우면 profile 미지정 up/down이 아무 서비스도 대상으로 삼지 않으므로 주의한다.
#
# 앱 소스는 이 레포가 아닌 ~/choimory_workspace/IdeaProjects/choimory-dev 아래 각 레포에 있으며,
# 각 레포의 Dockerfile로 빌드한다. 레포 위치는 .env의 MEMBER_API_CONTEXT, FRONT_CONTEXT로 지정한다.
# 레포 경로는 이미지를 빌드할 때만 필요하다. 이미지가 남아 있거나 db-only로 띄울 때는 레포가 없어도 된다.
#
# 개발할 때만 띄우는 용도라 restart 정책은 두지 않는다.
# choimory-local(개인용, *_choimory)과 구분하기 위해 container_name은 <서비스>_choimory-dev로 쓴다.
name: choimory-dev

services:
  # member-api의 회원, 권한 데이터 저장소
  postgres:
    profiles: ["all", "db-only", "back-only"]
    # choimory-local과 같은 버전을 쓴다.
    image: postgres:16.15-bookworm
    container_name: postgres_choimory-dev

    # choimory-local postgres가 5432를 쓰므로 15432로 연다. DataGrip 접속용이며 localhost에만 바인딩한다.
    ports:
      - "127.0.0.1:15432:5432"

    # down 해도 데이터가 남도록 bind mount로 둔다. 초기화하려면 이 디렉토리를 직접 삭제한다.
    volumes:
      - ${HOME}/choimory_workspace/DataGripProjects/docker_volume/choimory-dev/postgres:/var/lib/postgresql/data

    # 아래 계정, database는 데이터 디렉토리가 비어 있을 때(최초 기동)만 생성된다.
    # 테이블은 member-api 기동 시 Flyway가 만든다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul

    # member-api가 기동하자마자 Flyway를 실행하므로, 접속 가능해진 뒤에 member-api를 띄우기 위한 상태 확인
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # member-api의 Refresh Token, Access Token 블랙리스트 저장소
  redis:
    profiles: ["all", "db-only", "back-only"]
    # choimory-local과 같은 버전을 쓴다.
    image: redis:8.10.3
    container_name: redis_choimory-dev

    # ACL로 계정 인증을 건다. (choimory-local과 같은 방식)
    #   default 계정: 비밀번호 없이 접속되는 기본 계정이라 끈다.
    #   REDIS_USER 계정: 모든 키(~*), 채널(&*), 명령(+@all) 허용
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - ${REDIS_USER}
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"

    # choimory-local redis가 6379를 쓰므로 16379로 연다. localhost에만 바인딩한다.
    ports:
      - "127.0.0.1:16379:6379"

    volumes:
      - ${HOME}/choimory_workspace/DataGripProjects/docker_volume/choimory-dev/redis:/data

    environment:
      TZ: Asia/Seoul

    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user ${REDIS_USER} --pass ${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 회원 API (Spring Boot)
  member-api:
    profiles: ["all", "back-only"]
    # image 이름을 지정하지 않는다. down --rmi local이 직접 빌드한 이미지를 지우는 기준이 "image 이름 없음"이기 때문이다.
    build:
      # 앱 레포 위치는 .env의 MEMBER_API_CONTEXT로 지정한다. 상대경로는 이 compose.yaml 위치 기준이다.
      # 값이 없으면 빈 경로가 이 디렉토리로 풀려 원인을 알기 어려운 에러가 나므로, 필수 변수(:?)로 두어 바로 알려준다.
      # 변수 치환은 파일 전체에 먼저 적용되므로, 값이 없으면 빌드와 상관없는 명령(db-only, down)도 함께 멈춘다.
      context: ${MEMBER_API_CONTEXT:?.env에 MEMBER_API_CONTEXT(member-api 레포 경로)를 설정하세요}
    container_name: member-api_choimory-dev

    # 브라우저, IDE의 front는 localhost:8080으로, 컨테이너의 front는 host.docker.internal:8080으로 호출한다.
    # IDE로 member-api를 돌릴 때(--scale member-api=0)도 같은 8080을 쓰므로 front 설정을 바꿀 필요가 없다.
    ports:
      - "127.0.0.1:8080:8080"

    # application-datasource.yml, application-redis.yml, application-jwt.yml의 ${rdb-host} 같은 자리표시자는
    # Spring이 대문자+언더스코어 환경변수(RDB_HOST)로도 찾으므로 아래 이름으로 주입한다.
    # DB, Redis는 같은 compose 네트워크 안의 서비스 이름으로 접속한다.
    environment:
      SPRING_PROFILES_ACTIVE: local
      RDB_HOST: postgres
      RDB_PORT: 5432
      RDB_DATABASE: ${POSTGRES_DB}
      RDB_USER: ${POSTGRES_USER}
      RDB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Seoul

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 프론트 (Next.js)
  # IDE의 front와 같은 3000 포트를 쓰므로 둘을 동시에 띄우지 않는다.
  front:
    profiles: ["all", "front-only"]
    build:
      # 앱 레포 위치는 .env의 FRONT_CONTEXT로 지정한다. (member-api와 같은 이유로 필수 변수)
      context: ${FRONT_CONTEXT:?.env에 FRONT_CONTEXT(front 레포 경로)를 설정하세요}
      args:
        # 브라우저는 호스트에서 member-api를 호출하므로 localhost 주소를 빌드 시 번들에 넣는다.
        NEXT_PUBLIC_MEMBER_API_BASE_URL: http://localhost:8080
    container_name: front_choimory-dev

    # member-api의 CORS 허용 Origin(local 프로필)이 http://localhost:3000이므로 3000을 유지한다.
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      # 서버(Route Handler)는 호스트의 8080을 거쳐 member-api를 호출한다.
      # compose 서비스 이름(member-api) 대신 host.docker.internal을 써서, member-api가 컨테이너든 IDE든 같은 주소로 닿게 한다.
      MEMBER_API_BASE_URL: http://host.docker.internal:8080
      TZ: Asia/Seoul

    # front-only, --scale member-api=0처럼 member-api 컨테이너 없이 띄우는 경우가 있어 필수 의존으로 두지 않는다.
    depends_on:
      member-api:
        condition: service_started
        required: false
